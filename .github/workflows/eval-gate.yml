name: Eval Gate

# Enforces the L4 skill eval gate on every push and pull request. A skill that
# drops below its minimum pass rate — or a suite with fewer than 10 test cases —
# fails the build and blocks merge. This is the machine-enforced version of
# Design Principle #4 ("Eval-gated deployment").

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile skills, capabilities and eval runner
        run: python -m compileall src run_evals.py

      - name: Layer 1 — L4 skill regression eval gate
        run: python run_evals.py

      - name: Layers 2 & 3 — capability contracts and RM workflow scenarios
        run: python -m unittest discover -s tests -v

  # Separate job on purpose: the eval gate above installs nothing, so it stays
  # hermetic and fast. The UI smoke test needs Streamlit, so it gets its own
  # environment rather than adding a heavy dependency to the gate.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UI dependencies
        run: pip install streamlit python-dotenv

      - name: RM surface smoke test (drives the real Streamlit app)
        run: python -m unittest tests.test_app_smoke -v
